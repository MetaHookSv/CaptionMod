name: Build Windows x86 Release
description: Build, package and validate the CaptionMod runtime and gamedata.

outputs:
  archive-path:
    description: Absolute path to the Windows x86 7z archive.
    value: ${{ steps.package.outputs.archive-path }}

runs:
  using: composite
  steps:
    - name: Clone MetaHook and VGUI2Extension SDK headers
      shell: pwsh
      run: |
        $metahookPath = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'MetaHook'
        & git clone --depth 1 --branch main https://github.com/MetaHookSv/MetaHook $metahookPath
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & git -C $metahookPath rev-parse HEAD
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $vgui2extensionPath = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'VGUI2Extension'
        & git clone --depth 1 --branch main https://github.com/MetaHookSv/VGUI2Extension $vgui2extensionPath
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & git -C $vgui2extensionPath rev-parse HEAD
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "METAHOOK_SOURCE_PATH=$metahookPath" >> $env:GITHUB_ENV
        "VGUI2EXTENSION_SOURCE_PATH=$vgui2extensionPath" >> $env:GITHUB_ENV

    - name: Build and install
      shell: cmd
      run: call scripts\build-CaptionMod-x86-Release.bat "-DMETAHOOK_SOURCE_PATH=%METAHOOK_SOURCE_PATH%" "-DVGUI2EXTENSION_SOURCE_PATH=%VGUI2EXTENSION_SOURCE_PATH%"

    - name: Validate installed gamedata
      shell: cmd
      run: python scripts\validate-gamedata.py install\x86\Release\svencoop\metahook\gamedata\captionmod --manifest scripts\manifests\captionmod.json

    - name: Package runtime and gamedata
      id: package
      shell: pwsh
      working-directory: install/x86/Release
      run: |
        $archiveDirectory = Join-Path $env:GITHUB_WORKSPACE 'build/artifacts'
        New-Item -ItemType Directory -Path $archiveDirectory -Force | Out-Null
        $archivePath = Join-Path $archiveDirectory 'CaptionMod-windows-x86.7z'
        if (Test-Path -LiteralPath $archivePath -PathType Leaf) {
          Remove-Item -LiteralPath $archivePath
        }
        & 7z a -t7z $archivePath 'svencoop' 'svencoop_hidpi' 'gearbox' 'echoes' 'svencoop_schinese'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & 7z t $archivePath
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "archive-path=$archivePath" >> $env:GITHUB_OUTPUT
